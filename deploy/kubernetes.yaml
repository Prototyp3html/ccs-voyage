apiVersion: v1
kind: Namespace
metadata:
  name: devops-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccs-voyage
  namespace: devops-lab
spec:
  replicas: 2
  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: ccs-voyage

  template:
    metadata:
      labels:
        app: ccs-voyage

    spec:
      containers:
        - name: web
          image: ghcr.io/prototyp3html/ccs-voyage:REPLACE_WITH_IMAGE_TAG

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 512Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ccs-voyage
  namespace: devops-lab
spec:
  type: ClusterIP

  selector:
    app: ccs-voyage

  ports:
    - name: http
      port: 80
      targetPort: http
